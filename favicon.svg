<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- hand-drawn "AG", one continuous line per stroke -->
    <path id="ag" fill="none" stroke-linecap="round" stroke-linejoin="round"
          d="M7 49.5L17.25 12.5L27.5 49.5M10.07 38.4H24.43M52.95 15.63A8.75 8.75 0 0 0 37.5 21.25V40.75A8.75 8.75 0 0 0 55 40.75V32H46.5"/>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#ag" stroke="#000" stroke-width="4.5"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#efedf3"/>
  <!-- lavender echo, offset down-right, showing only outside the letters -->
  <g mask="url(#behind)">
    <use href="#ag" transform="translate(2 2)" stroke="#c4b5fd" stroke-width="4.5"/>
  </g>
  <!-- purple letters -->
  <use href="#ag" stroke="#4c1d95" stroke-width="4.5"/>
</svg>
